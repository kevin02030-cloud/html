<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(주)비에이텍 - 회사소개서</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="info-page-body">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>PDF 문서를 로딩 중입니다... 잠시만 기다려주세요.</p>
    </div>

    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-water"></i>
            (주)비에이텍
        </a>
        <ul class="nav-links">
            <li><a href="index.html">홈으로 돌아가기</a></li>
        </ul>
    </header>

    <div class="flipbook-container">
        <!-- Flipbook Wrapper -->
        <div class="book-wrapper">
            <div id="book">
                <!-- Pages will be dynamically injected here by flipbook.js -->
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="btn-prev" class="ctrl-btn" disabled><i class="fa-solid fa-chevron-left"></i> 이전</button>
            <span class="page-info">
                <span id="page-current">0</span> / <span id="page-total">0</span>
            </span>
            <button id="btn-next" class="ctrl-btn" disabled>다음 <i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Set worker path for PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    
    <!-- Page Flip Library (StPageFlip) -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
    
    <!-- Custom Flipbook Script -->
    <script src="js/flipbook.js"></script>
</body>
</html>
